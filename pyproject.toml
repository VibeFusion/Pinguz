[project]
name = "pinguz"
version = "0.1.0"
description = "MCP server for AI image and video generation via Muapi.ai"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.scripts]
pinguz = "pinguz.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinguz"]
